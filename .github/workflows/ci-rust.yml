name: CI • Rust

on:
  workflow_call:

permissions: {}

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # prevent a sudden announcement of a new advisory from failing CI
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          arguments: --all-features
          command: check ${{ matrix.checks }}

      - name: Summary
        run: echo "### ✅ Cargo Deny - ${{ matrix.checks }}" >> $GITHUB_STEP_SUMMARY

  cargo-machete:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: cargo machete
        uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2

      - name: Summary
        run: echo "### ✅ Cargo Machete - no unused dependencies" >> $GITHUB_STEP_SUMMARY

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update --component rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Summary
        run: echo "### ✅ Rustfmt - all files formatted" >> $GITHUB_STEP_SUMMARY

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build dependencies (Linux)
        uses: ./.github/actions/install-linux-deps

      - name: Free disk space on runner
        run: rm -rf /opt/hostedtoolcache

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Summary
        run: echo "### ✅ Tests - all workspace tests passed" >> $GITHUB_STEP_SUMMARY

  clippy:
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-24.04"
            arch: "x86_64"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            arch: "x86_64"
            target: "x86_64-pc-windows-msvc"
          - platform: "macos-latest"
            arch: "aarch64"
            target: "aarch64-apple-darwin" # for Arm based macs (M1 and above).

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        uses: ./.github/actions/install-linux-deps

      - name: Install build dependencies (macOS, aarch64)
        if: matrix.platform == 'macos-latest' && matrix.arch == 'aarch64'
        run: |
          brew update
          brew install opus

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Summary
        run: echo "### ✅ Clippy - ${{ matrix.platform }} (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
